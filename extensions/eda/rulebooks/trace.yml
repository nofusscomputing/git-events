---

- name: echo Webhook
  hosts: localhost
  match_multiple_rules: true

  sources:
    - name: Webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:

    - name: Log every event
      condition: event is defined
      action:
        - print_event:
            pretty: true

    - name: Trace
      condition: event is defined
      action:
        debug:
